<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - App Tienda</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <h3>Panel Admin</h3>
      <div class="user-info" id="sidebar-user"></div>
      <a class="active" data-section="pedidos">Pedidos</a>
      <a data-section="inventario">Inventario</a>
      <a data-section="usuarios">Usuarios</a>
      <div class="logout"><a id="btn-logout">Cerrar Sesión</a></div>
    </nav>
    <div class="main-content">
      <!-- PEDIDOS -->
      <div class="section active" id="sec-pedidos">
        <h1>Gestión de Pedidos</h1>
        <table>
          <thead><tr><th>Boleta</th><th>Cliente</th><th>Total</th><th>Método Pago</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead>
          <tbody id="pedidos-tbody"></tbody>
        </table>
      </div>
      <!-- INVENTARIO -->
      <div class="section" id="sec-inventario">
        <h1>Inventario</h1>
        <div class="form-inline" id="producto-form">
          <input type="text" id="prod-nombre" placeholder="Nombre">
          <input type="number" id="prod-precio" placeholder="Precio" step="0.01">
          <input type="number" id="prod-stock" placeholder="Stock">
          <input type="text" id="prod-categoria" placeholder="Categoría">
          <input type="number" id="prod-valoracion" placeholder="Valoración" step="0.1" min="0" max="5">
          <input type="text" id="prod-descripcion" placeholder="Descripción">
          <button id="btn-guardar-producto">Agregar</button>
        </div>
        <table>
          <thead><tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Valoración</th><th>Acciones</th></tr></thead>
          <tbody id="productos-tbody"></tbody>
        </table>
      </div>
      <!-- USUARIOS -->
      <div class="section" id="sec-usuarios">
        <h1>Gestión de Usuarios</h1>
        <table>
          <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Registro</th><th>Acciones</th></tr></thead>
          <tbody id="usuarios-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal editar usuario -->
  <div class="modal-overlay hidden" id="modal-editar-usuario">
    <div class="modal">
      <h2>Editar Usuario</h2>
      <input type="hidden" id="edit-user-id">
      <label>Nombre</label>
      <input type="text" id="edit-user-nombre">
      <label>Email</label>
      <input type="email" id="edit-user-email">
      <label>Rol</label>
      <select id="edit-user-rol">
        <option value="Cliente">Cliente</option>
        <option value="Admin">Administrador</option>
        <option value="Repartidor">Repartidor</option>
      </select>
      <label>Nueva contraseña (dejar vacío para mantener)</label>
      <input type="password" id="edit-user-password" placeholder="••••••••">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="cerrarModal('modal-editar-usuario')">Cancelar</button>
        <button class="btn-primary" id="btn-guardar-usuario">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    const socket = io();
    socket.on('alerta_nuevo_pedido', (pedido) => {
      if (usuario?.rol === 'Admin') {
        reproducirSonido();
        mostrarToast(`¡Nuevo pedido! ${pedido.boleta.numeroBoleta} - S/. ${pedido.boleta.montoTotal.toFixed(2)}`, 'info');
        cargarPedidos();
      }
    });
  </script>
</body>
</html>
